name: ops-observability

services:
  nginx-demo:
    image: quay.io/nginx/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ops]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx-exporter:
    image: quay.io/nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx-demo:8080/nginx_status"]
    depends_on:
      nginx-demo:
        condition: service_healthy
    networks: [ops]

  prometheus:
    image: quay.io/prometheus/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [nginx-exporter, alertmanager]
    networks: [ops]

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [ops]

  alert-sink:
    image: docker.io/library/python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/app/alert-sink.py"]
    volumes:
      - ./config/alert-sink.py:/app/alert-sink.py:ro
    networks: [ops]

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [ops]

networks:
  ops:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
