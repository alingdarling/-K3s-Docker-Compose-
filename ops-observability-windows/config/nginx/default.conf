server {
    listen 8080;
    server_name _;

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        default_type text/html;
        return 200 '<html><head><meta charset="utf-8"><title>Ops Observability Lab</title></head><body><h1>Windows 运维可观测性实战项目</h1><p>Nginx is running in Docker Desktop.</p></body></html>';
    }
}
